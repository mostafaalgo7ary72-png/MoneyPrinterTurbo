name: Generate Video

on:
  workflow_dispatch:
    inputs:
      # ---------- المحتوى ----------
      subject:
        description: "1) Video subject / keyword (English works best with stock sites)"
        required: true
        type: string
      language:
        description: "2) Script language code (en-US, ar-EG, fr-FR ...)"
        required: false
        default: "en-US"
        type: string
      script:
        description: "3) Full script (optional - skips LLM script generation)"
        required: false
        default: ""
        type: string
      terms:
        description: "4) Search keywords, comma-separated (optional - auto-generated if empty)"
        required: false
        default: ""
        type: string
      paragraphs:
        description: "5) Number of script paragraphs"
        required: false
        default: "1"
        type: choice
        options: ["1", "2", "3", "4", "5"]
      script_prompt:
        description: "6) Extra instructions for the script (optional)"
        required: false
        default: ""
        type: string

      # ---------- الموديل ----------
      llm_provider:
        description: "7) LLM provider (needs its secret: GROQ_API_KEY, GEMINI_API_KEY, ...)"
        required: false
        default: "groq"
        type: choice
        options: ["groq", "gemini", "openai", "deepseek", "openrouter"]
      llm_model:
        description: "8) LLM model name (groq: openai/gpt-oss-120b | gemini: gemini-2.5-flash | openai: gpt-4o-mini | deepseek: deepseek-chat)"
        required: false
        default: "openai/gpt-oss-120b"
        type: string

      # ---------- الفيديو ----------
      video_source:
        description: "9) Stock footage source (needs its secret)"
        required: false
        default: "pixabay"
        type: choice
        options: ["pixabay", "pexels", "coverr"]
      aspect:
        description: "10) Aspect ratio"
        required: false
        default: "9:16"
        type: choice
        options: ["9:16", "16:9", "1:1"]
      video_count:
        description: "11) Number of videos"
        required: false
        default: "1"
        type: string
      clip_duration:
        description: "12) Max seconds per source clip"
        required: false
        default: "5"
        type: string
      clip_speed:
        description: "13) Clip speed (0.5 - 2.0)"
        required: false
        default: "1.0"
        type: string
      concat_mode:
        description: "14) Clip order"
        required: false
        default: "random"
        type: choice
        options: ["random", "sequential"]
      transition:
        description: "15) Transition between clips"
        required: false
        default: "none"
        type: choice
        options: ["none", "shuffle", "fade-in", "fade-out", "slide-in", "slide-out", "zoom-in", "zoom-out"]

      # ---------- الصوت ----------
      voice_name:
        description: "16) Voice (en-US-JennyNeural-Female | en-US-GuyNeural-Male | ar-EG-SalmaNeural-Female | ar-SA-HamedNeural-Male | no-voice)"
        required: false
        default: "en-US-JennyNeural-Female"
        type: string
      voice_rate:
        description: "17) Voice speed (1.0 = normal)"
        required: false
        default: "1.0"
        type: string
      bgm_type:
        description: "18) Background music"
        required: false
        default: "random"
        type: choice
        options: ["random", "none"]
      bgm_volume:
        description: "19) Music volume (0 - 1)"
        required: false
        default: "0.2"
        type: string

      # ---------- الترجمة ----------
      subtitle_enabled:
        description: "20) Enable subtitles"
        required: false
        default: true
        type: boolean
      subtitle_position:
        description: "21) Subtitle position"
        required: false
        default: "bottom"
        type: choice
        options: ["bottom", "center", "top", "two_thirds_bottom"]
      font_name:
        description: "22) Subtitle font file in resource/fonts (BeVietnamPro-Bold.ttf | Charm-Bold.ttf | MicrosoftYaHeiBold.ttc | or your Arabic .ttf)"
        required: false
        default: "BeVietnamPro-Bold.ttf"
        type: string
      font_size:
        description: "23) Subtitle font size"
        required: false
        default: "60"
        type: string
      text_color:
        description: "24) Subtitle color (#RRGGBB)"
        required: false
        default: "#FFFFFF"
        type: string

      # ---------- أي إعداد تاني ----------
      extra_args:
        description: "25) Any other cli.py flags, e.g. --subtitle-display-mode word_by_word --stroke-width 2 (no spaces inside values)"
        required: false
        default: ""
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          # litellm 1.86.2 is not available on PyPI, so use an available version
          sed -i 's/litellm==1.86.2/litellm==1.93.2/' requirements.txt
          pip install -r requirements.txt

      - name: Create config.toml from secrets
        env:
          LLM_PROVIDER: ${{ inputs.llm_provider }}
          LLM_MODEL: ${{ inputs.llm_model }}
          VIDEO_SOURCE: ${{ inputs.video_source }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
        run: |
          cp config.example.toml config.toml
          python - <<'PY'
          import os
          import sys
          import toml

          with open("config.toml", encoding="utf-8") as f:
              cfg = toml.load(f)
          app = cfg.setdefault("app", {})

          provider = os.environ["LLM_PROVIDER"]
          llm_key = os.environ.get(provider.upper() + "_API_KEY", "").strip()
          if not llm_key:
              sys.exit(f"Missing secret {provider.upper()}_API_KEY")
          app["llm_provider"] = provider
          app[f"{provider}_api_key"] = llm_key
          if os.environ["LLM_MODEL"].strip():
              app[f"{provider}_model_name"] = os.environ["LLM_MODEL"].strip()
          if provider == "groq":
              app["groq_base_url"] = "https://api.groq.com/openai/v1"

          source = os.environ["VIDEO_SOURCE"]
          video_key = os.environ.get(source.upper() + "_API_KEY", "").strip()
          if not video_key:
              sys.exit(f"Missing secret {source.upper()}_API_KEY")
          app["video_source"] = source
          app[f"{source}_api_keys"] = [video_key]

          with open("config.toml", "w", encoding="utf-8") as f:
              toml.dump(cfg, f)
          PY

      - name: Generate video
        env:
          PYTHONPATH: ${{ github.workspace }}
          SUBJECT: ${{ inputs.subject }}
          LANGUAGE: ${{ inputs.language }}
          SCRIPT: ${{ inputs.script }}
          TERMS: ${{ inputs.terms }}
          PARAGRAPHS: ${{ inputs.paragraphs }}
          SCRIPT_PROMPT: ${{ inputs.script_prompt }}
          VIDEO_SOURCE: ${{ inputs.video_source }}
          ASPECT: ${{ inputs.aspect }}
          VIDEO_COUNT: ${{ inputs.video_count }}
          CLIP_DURATION: ${{ inputs.clip_duration }}
          CLIP_SPEED: ${{ inputs.clip_speed }}
          CONCAT_MODE: ${{ inputs.concat_mode }}
          TRANSITION: ${{ inputs.transition }}
          VOICE_NAME: ${{ inputs.voice_name }}
          VOICE_RATE: ${{ inputs.voice_rate }}
          BGM_TYPE: ${{ inputs.bgm_type }}
          BGM_VOLUME: ${{ inputs.bgm_volume }}
          SUBTITLE_ENABLED: ${{ inputs.subtitle_enabled }}
          SUBTITLE_POSITION: ${{ inputs.subtitle_position }}
          FONT_NAME: ${{ inputs.font_name }}
          FONT_SIZE: ${{ inputs.font_size }}
          TEXT_COLOR: ${{ inputs.text_color }}
          EXTRA_ARGS: ${{ inputs.extra_args }}
        run: |
          args=(--video-subject "$SUBJECT" --video-source "$VIDEO_SOURCE")

          # add <flag> <value>: only passed when the value is not empty
          add() { if [ -n "$2" ]; then args+=("$1" "$2"); fi; }

          add --video-language "$LANGUAGE"
          add --video-script "$SCRIPT"
          add --video-terms "$TERMS"
          add --paragraph-number "$PARAGRAPHS"
          add --video-script-prompt "$SCRIPT_PROMPT"
          add --video-aspect "$ASPECT"
          add --video-count "$VIDEO_COUNT"
          add --video-clip-duration "$CLIP_DURATION"
          add --video-clip-speed "$CLIP_SPEED"
          add --video-concat-mode "$CONCAT_MODE"
          add --video-transition-mode "$TRANSITION"
          add --voice-name "$VOICE_NAME"
          add --voice-rate "$VOICE_RATE"
          add --bgm-type "$BGM_TYPE"
          add --bgm-volume "$BGM_VOLUME"
          add --subtitle-position "$SUBTITLE_POSITION"
          add --font-name "$FONT_NAME"
          add --font-size "$FONT_SIZE"
          add --text-fore-color "$TEXT_COLOR"

          if [ "$SUBTITLE_ENABLED" = "true" ]; then
            args+=(--subtitle-enabled)
          else
            args+=(--no-subtitle-enabled)
          fi

          if [ -n "$EXTRA_ARGS" ]; then
            read -r -a extra <<< "$EXTRA_ARGS"
            args+=("${extra[@]}")
          fi

          echo "Running: python cli.py (${#args[@]} arguments)"
          python cli.py "${args[@]}"

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: generated-video
          path: storage/tasks/**/final-*.mp4
          if-no-files-found: error
          retention-days: 7
